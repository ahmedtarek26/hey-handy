name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 pulseaudio
          pulseaudio --start --exit-idle-time=-1 || true
      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev
      - name: Run unit and extension tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest
